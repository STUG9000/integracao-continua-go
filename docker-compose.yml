services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: root
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d root"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: golang:1.22
    working_dir: /app
    command: ["sh", "-c", "go mod download && go run main.go"]
    volumes:
      - ./:/app
    ports:
      - "8070:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure